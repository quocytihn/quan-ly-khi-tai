{% extends 'inventory/base.html' %}{% block heading %}Mã QR khí tài{% endblock %}{% block content %}<div class="card content-card text-center" style="max-width:520px;margin:auto"><h5>{{ asset.name }}</h5><div class="muted">{{ asset.code }}</div><img class="my-3" style="width:260px;max-width:100%" src="data:image/png;base64,{{ qr_data }}" alt="QR"><p class="muted">Quét mã để mở hồ sơ khí tài.</p><a class="btn btn-primary" href="{{ scan_url }}" target="_blank">Mở liên kết tra cứu</a><button class="btn btn-outline-secondary mt-2" onclick="window.print()">In mã QR</button></div>{% endblock %}
