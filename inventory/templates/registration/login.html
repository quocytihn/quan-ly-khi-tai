<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng nhập</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:linear-gradient(135deg,#10233d,#2563eb);min-height:100vh;display:grid;place-items:center}.login{width:min(420px,92vw);background:white;padding:34px;border-radius:18px;box-shadow:0 20px 70px #0003}</style></head><body><div class="login"><h4 class="fw-bold mb-1">Quản lý khí tài</h4><p class="text-secondary mb-4">Đăng nhập để tiếp tục</p>{% if form.errors %}<div class="alert alert-danger">Tên đăng nhập hoặc mật khẩu không đúng.</div>{% endif %}<form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label">Tên đăng nhập</label><input class="form-control" name="username" autofocus required></div><div class="mb-3"><label class="form-label">Mật khẩu</label><input class="form-control" type="password" name="password" required></div><button class="btn btn-primary w-100 py-2">Đăng nhập</button></form><small class="text-secondary d-block mt-3">Tài khoản demo được tạo theo hướng dẫn trong README.</small></div></body></html>
